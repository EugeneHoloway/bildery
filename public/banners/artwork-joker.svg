<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372">
  <!-- Fanned playing cards with a joker on top, transparent background -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e5e7eb"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a21caf"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="150" y="70" width="180" height="260" rx="16" fill="url(#card)" transform="rotate(-18 240 200)"/>
    <rect x="230" y="60" width="180" height="260" rx="16" fill="url(#card)" transform="rotate(-6 320 190)"/>
    <rect x="310" y="60" width="180" height="260" rx="16" fill="url(#card)" transform="rotate(8 400 190)"/>
  </g>
  <g transform="rotate(8 400 190)">
    <text x="330" y="110" font-family="Georgia, serif" font-weight="700" font-size="44" fill="#be123c">J</text>
    <text x="470" y="300" font-family="Georgia, serif" font-weight="700" font-size="44" fill="#be123c" text-anchor="end">J</text>
    <path d="M400 130 l-42 60 h84 z" fill="url(#hat)"/>
    <circle cx="358" cy="190" r="9" fill="#facc15"/><circle cx="442" cy="190" r="9" fill="#facc15"/><circle cx="400" cy="130" r="9" fill="#facc15"/>
    <circle cx="400" cy="230" r="34" fill="#fde68a"/>
    <circle cx="388" cy="224" r="4" fill="#111827"/><circle cx="412" cy="224" r="4" fill="#111827"/>
    <path d="M384 240 q16 16 32 0" stroke="#be123c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M366 264 q34 22 68 0 v22 h-68 z" fill="#be123c"/>
  </g>
</svg>
