    <ellipse cx="0" cy="-14" rx="150" ry="42" fill="#3b82f6"/>
    <ellipse cx="0" cy="-14" rx="96" ry="26" fill="#fff" opacity=".9"/>
    <ellipse cx="0" cy="-14" rx="70" ry="19" fill="#3b82f6"/>
